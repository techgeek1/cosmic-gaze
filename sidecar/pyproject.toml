[project]
name            = "gaze-ml"
version         = "0.1.0"
description     = "GPU face/gaze inference sidecar for cosmic-gaze"
readme          = "README.md"
requires-python = ">=3.12,<3.13"
license         = { text = "MIT" }

dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.10",
    "torch>=2.6",
    "torchvision>=0.21",
    "mediapipe>=0.10.14",
    "triton-rocm>=3.6; sys_platform == 'linux'",
    "safetensors>=0.4",
]

[project.scripts]
gaze-ml = "gaze_ml.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaze_ml"]

[[tool.uv.index]]
name     = "pytorch-rocm"
url      = "https://download.pytorch.org/whl/rocm7.0"
explicit = true

[tool.uv.sources]
torch       = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
