# Frozen snapshot of the 2026-08-25 desk config, for tests only. The live desk.toml
# tracks the physical desk and changes with every remount or re-measure; the
# geometry and webcam test assertions were written against this coherent layout
# and pin it here. Do not update it to match the desk — that is the point.

# Physical layout of the desk. World frame: origin at the tracker (top edge of the small
# panel, at the seam between DP-2 and DP-1), +X right, +Y up, +Z toward the user, mm.
#
# Values marked MEASURE are eyeballed from a photo (2026-08-25) and should be replaced
# with tape-measure numbers. Phase 0 results are insensitive to a few cm either way.
#
# Logical rects come from `cosmic-randr list` / `wayland-info -i wl_output` and must be
# kept in sync with the compositor layout.

eye_mm     = [0.0, 180.0, 650.0]   # MEASURE: eye height above tracker, seated distance
tracker_mm = [0.0, 0.0, 0.0]

# LG 38GN950, 38" 21:10, 2300R. Main display, right of the seam.
[[outputs]]
name          = "DP-1"
logical_x     = 2559.0
logical_y     = 0.0
logical_w     = 3840.0
logical_h     = 1600.0
physical_w_mm = 880.0
physical_h_mm = 370.0
radius_mm     = 2300.0
position_mm   = [437.0, 185.0, -120.0]   # MEASURE: centre; left edge at the seam
yaw_deg       = -12.0                    # MEASURE: panel turned to face the user

# VIOTEK GNV27DB, 27" 16:9, 1500R. Left of the seam, angled in.
[[outputs]]
name          = "DP-2"
logical_x     = 0.0
logical_y     = 160.0
logical_w     = 2560.0
logical_h     = 1440.0
physical_w_mm = 600.0
physical_h_mm = 340.0
radius_mm     = 1500.0
position_mm   = [-300.0, 170.0, -60.0]   # MEASURE
yaw_deg       = 20.0                     # MEASURE

# 11" 16:10 portable panel, flat, on the desk below the seam. 1920x1200 physical; the
# compositor uses fractional scale ~1.15 so the logical size is 1670x1043 (wl_output.scale
# rounds up to 2 and lies; zxdg_output_v1 is authoritative). Reports no EDID size; 237x148 mm from the panel spec. Tracker mounts on
# its top edge. Occasionally drops off the compositor's output list; keep enabled.
[[outputs]]
name          = "HDMI-A-1"
logical_x     = 1506.0
logical_y     = 1600.0
logical_w     = 1670.0
logical_h     = 1043.0
physical_w_mm = 237.0
physical_h_mm = 148.0
radius_mm     = 0.0
position_mm   = [-40.0, -75.0, 100.0]    # MEASURE
pitch_deg     = -15.0                    # MEASURE: top tilted away from the user

# Webcam (Logitech C920), 2026-08-26 placement: on a bottle on the desk at about the seam,
# just right of the small panel and slightly above its top edge, ~25 cm in front of it,
# looking up at the face from ~43 cm. Camera frame is OpenCV (+X right, +Y down, +Z forward
# out of the lens); the provider applies a fixed 180° roll so a camera facing the user maps
# onto desk +Z, then yaw/pitch/roll below in the SAME convention as the panels (right-hand
# rule about desk +Y / +X / +Z: positive pitch tilts the optical axis DOWN, negative yaw turns
# it toward -X). Derived from the photo and the nominal eye; MEASURE.
[camera]
device       = "/dev/video0"
position_mm  = [100.0, 80.0, 250.0]     # MEASURE: lens ~245 mm above the desk (1 L Nalgene 215 mm + C920), panel top edge ~165 mm
yaw_deg      = -14.0                    # MEASURE: turned toward -X, at the eye
pitch_deg    = -14.0                    # MEASURE: tilted UP at the face (eye ~100 mm above, ~410 mm away)
roll_deg     = 0.0
hfov_deg     = 70.4                     # Logitech C920: 70.4° H, 43.3° V (78° diagonal); used when no intrinsics file
width        = 1920
height       = 1080

[noise]
rate_hz         = 120.0
jitter_deg      = 0.2    # per-sample precision; bias = sqrt(sigma^2 - jitter^2) per fixation
bias_redraw_deg = 1.0
drift_deg       = 0.0
latency_s       = 0.0

[noise.profile]
sigma_deg      = 0.7
flat_to_deg    = 25.0
ramp_to_deg    = 35.0
ramp_factor    = 3.0
invalid_at_deg = 40.0
